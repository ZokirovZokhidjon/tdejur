<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Наманган Турма Назорат</title>
    <style>
        body { background-color: #2c352a; color: #d1d8c5; font-family: sans-serif; padding: 10px; }
        .header { background-color: #1a221a; padding: 15px; border-bottom: 5px solid #4a5d23; text-align: center; color: #a3b18a; }
        .section { background-color: #3e4a3d; padding: 15px; border: 2px solid #556b2f; border-radius: 8px; margin-top: 15px; overflow-x: auto; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #262e26; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #556b2f; padding: 8px; text-align: left; }
        input { width: 100%; padding: 8px; margin-bottom: 5px; background: #262e26; border: 1px solid #556b2f; color: white; border-radius: 4px; }
        .btn { background-color: #4a5d23; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        .del-btn { background-color: #8b0000; color: white; padding: 5px; border: none; cursor: pointer; }
        .edit-btn { background-color: #4a5d23; color: white; padding: 5px; border: none; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Назорат Тизими</h1>
    <div style="display: flex; gap: 5px; justify-content: center;" id="authArea">
        <input type="password" id="menuPass" placeholder="Парол..." style="width: 120px;">
        <button onclick="checkPassword()" style="padding: 10px; background: #4a5d23; color: white; border: none; cursor: pointer;">Кириш</button>
    </div>
    <button id="logoutBtn" onclick="logout()" style="display: none; padding: 8px; background: #8b0000; color: white; border: none; margin-top: 5px; cursor: pointer;">Тизимдан чиқиш (Logout)</button>
</div>

<div class="section">
    <h2>Маҳбуслар рўйхати</h2>
    <table id="prisonerTable">
        <tr>
            <th>Шарифи / Исми / Отасининг исми</th>
            <th>Туғилган куни / йили / манзили</th>
            <th>Модда / Кол</th>
            <th>Муддат / Сана</th>
            <th>Касал / Дори</th>
            <th>Дачка / Вақт</th>
            <th>Ходим / Камера</th>
        </tr>
    </table>
</div>

<div class="section" id="adminPanel" style="display:none;">
    <h2 id="formTitle">Маълумот қўшиш</h2>
    <input type="hidden" id="editId">
    
    <div class="row">
        <input type="text" id="p_lname" placeholder="Шарифи (Фамилия)">
        <input type="text" id="p_fname" placeholder="Исми">
        <input type="text" id="p_mname" placeholder="Отасининг исми">
    </div>
    <div class="row">
        <input type="text" id="p_bday" placeholder="Туғилган куни ва ойи (масал: 28-сентябр)">
        <input type="text" id="p_byear" placeholder="Туғилган йили (масал: 1975)">
        <input type="text" id="p_bplace" placeholder="Туғилган манзили (Вайлоят/Туман)">
    </div>
    
    <div class="row">
        <input type="text" id="p2" placeholder="Модда"> 
        <input type="text" id="p3" placeholder="Колонна / Ҳудуд">
    </div>
    <div class="row">
        <input type="text" id="p4" placeholder="Муддати"> 
        <input type="text" id="p5" placeholder="Озодлик санаси">
    </div>
    <div class="row">
        <input type="text" id="p6" placeholder="Касаллик тури"> 
        <input type="text" id="p7" placeholder="Дори берилган кун">
    </div>
    <div class="row">
        <input type="text" id="p8" placeholder="Дачка олинган сана"> 
        <input type="text" id="p9" placeholder="Дачка берилган вақт">
    </div>
    <input type="text" id="p10" placeholder="Масъул ходим исми ва Камера рақами">
    
    <button class="btn" id="saveBtn" onclick="saveData()">Маълумотларни сақлаш</button>
    
    <h3>Таҳрирлаш / Ўчириш</h3>
    <table id="adminTable"></table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, remove, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBZzChaKMvah_Rr9Sex-ay-T3Jjo5Tr58A",
        authDomain: "redzone-1b794.firebaseapp.com",
        databaseURL: "https://redzone-1b794-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "redzone-1b794",
        storageBucket: "redzone-1b794.firebasestorage.app",
        messagingSenderId: "224500137584",
        appId: "1:224500137584:web:a760c3a21ead427c64feb5",
        measurementId: "G-WETFZPZ0PS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Маълумотларни сақлаш ва янгилаш
    window.saveData = () => {
        const id = document.getElementById('editId').value;
        const data = { 
            p_lname: document.getElementById('p_lname').value,
            p_fname: document.getElementById('p_fname').value,
            p_mname: document.getElementById('p_mname').value,
            p_bday: document.getElementById('p_bday').value,
            p_byear: document.getElementById('p_byear').value,
            p_bplace: document.getElementById('p_bplace').value,
            p2: document.getElementById('p2').value, 
            p3: document.getElementById('p3').value, 
            p4: document.getElementById('p4').value, 
            p5: document.getElementById('p5').value, 
            p6: document.getElementById('p6').value, 
            p7: document.getElementById('p7').value, 
            p8: document.getElementById('p8').value, 
            p9: document.getElementById('p9').value, 
            p10: document.getElementById('p10').value 
        };
                
        if (id) {
            update(ref(db, 'prisoners/' + id), data).then(() => location.reload());
        } else {
            push(ref(db, 'prisoners/'), data).then(() => location.reload());
        }
    };

    // Таҳрирлаш тугмаси босилганда майдонларни тўлдириш
    window.editPrisoner = (id, p) => {
        document.getElementById('editId').value = id;
        document.getElementById('p_lname').value = p.p_lname || '';
        document.getElementById('p_fname').value = p.p_fname || '';
        document.getElementById('p_mname').value = p.p_mname || '';
        document.getElementById('p_bday').value = p.p_bday || '';
        document.getElementById('p_byear').value = p.p_byear || '';
        document.getElementById('p_bplace').value = p.p_bplace || '';
        
        for(let i = 2; i <= 10; i++) {
            if(i !== 3 && i !== 5 && i !== 7 && i !== 9) {
                document.getElementById('p' + i).value = p['p' + i] || '';
            }
        }
        document.getElementById('p3').value = p.p3 || '';
        document.getElementById('p5').value = p.p5 || '';
        document.getElementById('p7').value = p.p7 || '';
        document.getElementById('p9').value = p.p9 || '';
        
        document.getElementById('saveBtn').innerText = "Янгилаш";
        document.getElementById('formTitle').innerText = "Таҳрирлаш";
    };

    // Маълумотни ўчириш
    window.deletePrisoner = (id) => { 
        if(confirm("Ушбу маҳбусга тегишли барча маълумотларни ўчирмоқчимисиз?")) {
            remove(ref(db, 'prisoners/' + id)).then(() => location.reload()); 
        }
    };

    // Паролни текшириш
    window.checkPassword = () => {
        const pass = document.getElementById("menuPass").value;
        if (pass === "7777") {
            localStorage.setItem("sessionAdmin", "7777");
            location.reload(); 
        } else { 
            alert('Парол хато!'); 
        }
    };

    // Тизимдан чиқиш
    window.logout = () => {
        localStorage.removeItem("sessionAdmin");
        location.reload();
    };

    // Саҳифа юкланганда базадан маълумотларни ўқиш
    window.onload = async () => {
        const isAdmin = localStorage.getItem("sessionAdmin") === "7777";

        if (isAdmin) {
            document.getElementById("adminPanel").style.display = 'block';
            document.getElementById("authArea").style.display = 'none';
            document.getElementById("logoutBtn").style.display = 'inline-block';
        }

        try {
            const snapshot = await get(ref(db, 'prisoners/'));
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const p = child.val();
                    
                    // Тўлиқ Ф.И.Ш ва туғилган маълумотлар сатрларини бирлаштириш
                    const fullName = `${p.p_lname || ''} ${p.p_fname || ''} ${p.p_mname || ''}`.trim() || 'Киритилмаган';
                    const birthDetails = `${p.p_bday || ''} ${p.p_byear || ''}-й, ${p.p_bplace || ''}`.trim() || 'Киритилмаган';

                    // Асосий жадвал рўйхати
                    document.getElementById('prisonerTable').innerHTML += `<tr>
                        <td><strong>${fullName}</strong></td>
                        <td>${birthDetails}</td>
                        <td>${p.p2 || ''} / ${p.p3 || ''}</td>
                        <td>${p.p4 || ''} / ${p.p5 || ''}</td>
                        <td>${p.p6 || ''} / ${p.p7 || ''}</td>
                        <td>${p.p8 || ''} - ${p.p9 || ''}</td>
                        <td>${p.p10 || ''}</td>
                    </tr>`;
                    
                    // Админ бошқарув жадвали
                    if(isAdmin) {
                        window['prisoner_data_' + child.key] = p;
                        document.getElementById('adminTable').innerHTML += `<tr>
                            <td>${fullName}</td>
                            <td>
                                <button class="edit-btn" onclick="editPrisoner('${child.key}', window['prisoner_data_${child.key}'])">✍️ Таҳрирлаш</button>
                                <button class="del-btn" onclick="deletePrisoner('${child.key}')">❌ Ўчириш</button>
                            </td>
                        </tr>`;
                    }
                });
            }
        } catch (error) {
            console.error("Маълумот юклашда хатолик:", error);
        }
    };

    document.getElementById("menuPass").addEventListener("keypress", (e) => { 
        if(e.key === "Enter") window.checkPassword(); 
    });
</script>
</body>
</html>
