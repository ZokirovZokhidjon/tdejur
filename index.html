<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наманган Турма Назорат</title>
    <style>
        body { background-color: #2c352a; color: #d1d8c5; font-family: sans-serif; padding: 10px; }
        .header { background-color: #1a221a; padding: 15px; border-bottom: 5px solid #4a5d23; text-align: center; color: #a3b18a; }
        .section { background-color: #3e4a3d; padding: 15px; border: 2px solid #556b2f; border-radius: 8px; margin-top: 15px; overflow-x: auto; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #262e26; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #556b2f; padding: 8px; text-align: left; }
        th { background-color: #4a5d23; color: white; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; background: #262e26; border: 1px solid #556b2f; color: white; border-radius: 4px; }
        .btn { background-color: #4a5d23; color: white; padding: 12px; border: none; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }
        .del-btn { background-color: #8b0000; color: white; padding: 5px; border: none; cursor: pointer; }
        .edit-btn { background-color: #4a5d23; color: white; padding: 5px; border: none; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Назорат Тизими</h1>
    <div style="display: flex; gap: 5px; justify-content: center; margin-top: 10px;">
        <input type="password" id="menuPass" placeholder="Парол..." style="width: 120px;">
        <button onclick="checkPassword()" style="padding: 10px; background: #4a5d23; color: white; border: none;">Кириш</button>
    </div>
</div>

<div class="section">
    <h2>Маҳбуслар рўйхати</h2>
    <table id="prisonerTable">
        <tr><th>Ф.И.Ш</th><th>Айблов/Колонна</th><th>Соғлиқ/Дори</th><th>Дачка/Вақт</th></tr>
    </table>
</div>

<div class="section" id="adminPanel" style="display:none;">
    <h2>Навбатчи кабинети (Бошқарув)</h2>
    <input type="text" id="p1" placeholder="Ф.И.Ш">
    <div class="row">
        <input type="text" id="p2" placeholder="Моддаси"> <input type="text" id="p3" placeholder="Колонна/Ҳудуд">
    </div>
    <div class="row">
        <input type="text" id="p4" placeholder="Муддати"> <input type="text" id="p5" placeholder="Озод бўлиш санаси">
    </div>
    <div class="row">
        <input type="text" id="p6" placeholder="Касаллик"> <input type="text" id="p7" placeholder="Дори берилган кун">
    </div>
    <div class="row">
        <input type="text" id="p8" placeholder="Дачка санаси"> <input type="text" id="p9" placeholder="Дачка вақти">
    </div>
    <input type="text" id="p10" placeholder="Масъул ходим ва Камера">
    <button class="btn" onclick="saveData()">Маълумотларни сақлаш</button>
    
    <h3>Таҳрирлаш/Ўчириш</h3>
    <table id="adminTable"></table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, remove, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const db = getDatabase(initializeApp({
        databaseURL: "https://tdejur-e5d96-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "tdejur-e5d96"
    }));

    // Enter тугмаси
    document.getElementById("menuPass").addEventListener("keypress", (e) => { if(e.key === "Enter") checkPassword(); });

    window.saveData = () => {
        const data = {
            fio: document.getElementById('p1').value,
            modda: document.getElementById('p2').value + " / " + document.getElementById('p3').value,
            health: document.getElementById('p6').value + " / " + document.getElementById('p7').value,
            dacha: document.getElementById('p8').value + " - " + document.getElementById('p9').value
        };
        push(ref(db, 'prisoners/'), data).then(() => location.reload());
    };

    window.deletePrisoner = (id) => { if(confirm("Ўчирмоқчимисиз?")) remove(ref(db, 'prisoners/' + id)).then(() => location.reload()); };

    window.onload = async () => {
        const snapshot = await get(ref(db, 'prisoners/'));
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const p = child.val();
                document.getElementById('prisonerTable').innerHTML += `<tr><td>${p.fio}</td><td>${p.modda}</td><td>${p.health}</td><td>${p.dacha}</td></tr>`;
                document.getElementById('adminTable').innerHTML += `<tr><td>${p.fio}</td><td>
                    <button class="edit-btn" onclick="alert('Таҳрирлаш функцияси фаол')">✍️</button>
                    <button class="del-btn" onclick="deletePrisoner('${child.key}')">❌</button>
                </td></tr>`;
            });
        }
    };

    window.checkPassword = () => {
        if (document.getElementById("menuPass").value === "7777") {
            document.getElementById("adminPanel").style.display = 'block';
        } else { alert('Парол хато!'); }
    };
</script>

</body>
</html>
