<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Наманган Турма Назорат</title>
    <style>
        body { background-color: #2c352a; color: #d1d8c5; font-family: sans-serif; padding: 10px; }
        .header { background-color: #1a221a; padding: 15px; border-bottom: 5px solid #4a5d23; text-align: center; color: #a3b18a; }
        .section { background-color: #3e4a3d; padding: 15px; border: 2px solid #556b2f; border-radius: 8px; margin-top: 15px; overflow-x: auto; }
        .form-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #262e26; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #556b2f; padding: 8px; text-align: left; }
        input { width: 100%; padding: 10px; background: #262e26; border: 1px solid #556b2f; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #4a5d23; color: white; padding: 12px; border: none; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .del-btn { background-color: #8b0000; color: white; padding: 5px; border: none; cursor: pointer; }
        .edit-btn { background-color: #4a5d23; color: white; padding: 5px; border: none; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Назорат Тизими</h1>
    <div id="loginArea" style="display: flex; gap: 5px; justify-content: center;">
        <input type="password" id="menuPass" placeholder="Парол..." style="width: 120px;">
        <button onclick="checkPassword()" style="padding: 10px; background: #4a5d23; color: white; border: none;">Кириш</button>
    </div>
    <button id="logoutBtn" onclick="logout()" style="display:none; background:#8b0000; color:white; border:none; padding:10px; margin-top:10px;">Чиқиш</button>
</div>

<div class="section">
    <h2>Маҳбуслар рўйхати</h2>
    <table id="prisonerTable">
        <tr><th>Ф.И.Ш</th><th>Модда/Кол</th><th>Муддат/Сана</th><th>Касал/Дори</th><th>Дачка</th><th>Ходим/Камера</th></tr>
    </table>
</div>

<div class="section" id="adminPanel" style="display:none;">
    <h2 id="formTitle">Маълумот қўшиш</h2>
    <input type="hidden" id="editId">
    <div class="form-group">
        <div class="col"><input type="text" id="p1" placeholder="Фамилия"></div>
        <div class="col"><input type="text" id="p2" placeholder="Исм"></div>
        <div class="col"><input type="text" id="p3" placeholder="Отасининг исми"></div>
    </div>
    <div class="form-group">
        <div class="col"><input type="text" id="p4" placeholder="Жиноят моддаси"></div>
        <div class="col"><input type="text" id="p5" placeholder="Колонна/Ҳудуд"></div>
    </div>
    <div class="form-group">
        <div class="col"><input type="text" id="p6" placeholder="Жазо муддати"></div>
        <div class="col"><input type="text" id="p7" placeholder="Озод бўлиш санаси"></div>
    </div>
    <div class="form-group">
        <div class="col"><input type="text" id="p8" placeholder="Касаллик"></div>
        <div class="col"><input type="text" id="p9" placeholder="Дори берилган кун"></div>
    </div>
    <div class="form-group">
        <div class="col"><input type="text" id="p10" placeholder="Дачка санаси/вақти"></div>
        <div class="col"><input type="text" id="p11" placeholder="Масъул ходим/Камера"></div>
    </div>
    <button class="btn" id="saveBtn" onclick="saveData()">Маълумотларни сақлаш</button>
    <h3>Таҳрирлаш/Ўчириш</h3>
    <table id="adminTable"></table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, remove, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const db = getDatabase(initializeApp({
        databaseURL: "https://tdejur-e5d96-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "tdejur-e5d96"
    }));

    window.checkPassword = () => {
        if (document.getElementById("menuPass").value === "7777") {
            localStorage.setItem("isAdmin", "true");
            location.reload();
        } else { alert('Парол хато!'); }
    };

    window.logout = () => { localStorage.removeItem("isAdmin"); location.reload(); };

    window.saveData = () => {
        const id = document.getElementById('editId').value;
        const data = {};
        for(let i=1; i<=11; i++) data['p'+i] = document.getElementById('p'+i).value;
        if (id) update(ref(db, 'prisoners/' + id), data).then(() => location.reload());
        else push(ref(db, 'prisoners/'), data).then(() => location.reload());
    };

    window.editPrisoner = (id, p) => {
        document.getElementById('editId').value = id;
        for(let i=1; i<=11; i++) document.getElementById('p'+i).value = p['p'+i] || '';
        document.getElementById('saveBtn').innerText = "Янгилаш";
        document.getElementById('formTitle').innerText = "Таҳрирлаш";
        window.scrollTo(0, document.getElementById('adminPanel').offsetTop);
    };

    window.deletePrisoner = (id) => { if(confirm("Ўчирмоқчимисиз?")) remove(ref(db, 'prisoners/' + id)).then(() => location.reload()); };

    window.onload = async () => {
        if (localStorage.getItem("isAdmin") === "true") {
            document.getElementById("adminPanel").style.display = 'block';
            document.getElementById("loginArea").style.display = 'none';
            document.getElementById("logoutBtn").style.display = 'block';
        }
        const snapshot = await get(ref(db, 'prisoners/'));
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const p = child.val();
                document.getElementById('prisonerTable').innerHTML += `<tr><td>${p.p1} ${p.p2} ${p.p3}</td><td>${p.p4}/${p.p5}</td><td>${p.p6}/${p.p7}</td><td>${p.p8}/${p.p9}</td><td>${p.p10}</td><td>${p.p11}</td></tr>`;
                document.getElementById('adminTable').innerHTML += `<tr><td>${p.p1}</td><td>
                    <button class="edit-btn" onclick='editPrisoner("${child.key}", ${JSON.stringify(p)})'>✍️</button>
                    <button class="del-btn" onclick="deletePrisoner('${child.key}')">❌</button>
                </td></tr>`;
            });
        }
    };
    document.getElementById("menuPass").addEventListener("keypress", (e) => { if(e.key === "Enter") checkPassword(); });
</script>
</body>
</html>
