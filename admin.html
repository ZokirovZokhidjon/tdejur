<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Турма Назорат Тизими: Навбатчи Кабинети</title>
    <style>
        body { background-color: #2c3e2d; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .header { background-color: #1a241a; padding: 20px; text-align: center; border-bottom: 4px solid #556b2f; margin-bottom: 20px; }
        .section { background-color: #3e4f3e; padding: 20px; border: 1px solid #556b2f; border-radius: 8px; }
        
        /* Инпутлар услуби */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #a8c69f; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #556b2f; background: #2a362a; color: white; box-sizing: border-box; }
        
        .btn { background-color: #556b2f; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Навбатчи учун маълумот киритиш панели</h1>
</div>

<div class="section">
    <div id="adminPanel">
        <div class="input-group"><label>1. Ф.И.Ш (Отасининг исми билан)</label><input type="text"></div>
        <div class="input-group"><label>2. Туғилган санаси (кун/ой/йил)</label><input type="text"></div>
        <div class="input-group"><label>3. Туғилган жойи</label><input type="text"></div>
        <div class="input-group"><label>4. Модда ва манзилли колонна</label><input type="text"></div>
        <div class="input-group"><label>5. Муддат (йил) ва озод бўлиш санаси</label><input type="text"></div>
        <div class="input-group"><label>6. Касаллик тури (сахар, ўпка ва ҳ.к.)</label><input type="text"></div>
        <div class="input-group"><label>7. Масъул ходим</label><input type="text"></div>
        <div class="input-group"><label>8. Камера рақами</label><input type="text"></div>
        <div class="input-group"><label>9. Охирги дачка санаси ва вақти</label><input type="text"></div>
        <div class="input-group"><label>10. Кейинги кўришиш куни</label><input type="text"></div>
        
        <button class="btn" onclick="alert('Маълумот сақланди!')">Маълумотларни тизимга киритиш</button>
    </div>
</div>

</body>
</html>
