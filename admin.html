
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Наманган Турма Назорат</title>
    <style>
        body { background-color: #2c352a; color: #d1d8c5; font-family: sans-serif; padding: 10px; }
        .header { background-color: #1a221a; padding: 15px; border-bottom: 5px solid #4a5d23; text-align: center; color: #a3b18a; }
        .section { background-color: #3e4a3d; padding: 15px; border: 2px solid #556b2f; border-radius: 8px; margin-top: 15px; overflow-x: auto; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #262e26; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #556b2f; padding: 8px; text-align: left; }
        input { width: 100%; padding: 8px; margin-bottom: 5px; background: #262e26; border: 1px solid #556b2f; color: white; border-radius: 4px; }
        .btn { background-color: #4a5d23; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        .del-btn { background-color: #8b0000; color: white; padding: 5px; border: none; cursor: pointer; }
        .edit-btn { background-color: #4a5d23; color: white; padding: 5px; border: none; cursor: pointer; margin-right: 5px; }
    .exit a{
        text-align: center;
        text-decoration: solid;
        text-shadow: 3px 5px 8px;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 16px;
        color: gold;
    }
    </style>
</head>
<body>

<div class="header">
    <h1>Назорат Тизими</h1>
    <div style="display: flex; gap: 5px; justify-content: center;">
        <input type="password" id="menuPass" placeholder="Парол..." style="width: 120px;">
        <button onclick="checkPassword()" style="padding: 10px; background: #4a5d23; color: white; border: none;">Кириш</button>
    </div>
</div>

<div class="section">
    <h2>Маҳбуслар рўйхати</h2>
    <table id="prisonerTable">
        <tr><th>Ф.И.Ш</th><th>Модда/Кол</th><th>Муддат/Сана</th><th>Касал/Дори</th><th>Дачка/Вақт</th><th>Ходим/Камера</th></tr>
    </table>
</div>

<div class="section" id="adminPanel" style="display:none;">
    <h2 id="formTitle">Маълумот қўшиш</h2>
    <input type="hidden" id="editId">
    <input type="text" id="p1" placeholder="1. Ф.И.Ш">
    <div class="row">
        <input type="text" id="p2" placeholder="2. Модда"> <input type="text" id="p3" placeholder="3. Колонна/Ҳудуд">
    </div>
    <div class="row">
        <input type="text" id="p4" placeholder="4. Муддати"> <input type="text" id="p5" placeholder="5. Озод сана">
    </div>
    <div class="row">
        <input type="text" id="p6" placeholder="6. Касаллик"> <input type="text" id="p7" placeholder="7. Дори берилган кун">
    </div>
    <div class="row">
        <input type="text" id="p8" placeholder="8. Дачка санаси"> <input type="text" id="p9" placeholder="9. Дачка вақти">
    </div>
    <input type="text" id="p10" placeholder="10. Масъул ходим ва Камера">
    <button class="btn" id="saveBtn" onclick="saveData()">Маълумотларни сақлаш</button>
    <h3>Таҳрирлаш/Ўчириш</h3>
    <table id="adminTable"></table>
</div>
<div class="exit">
    <a href="index.html">Чикиш</a>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, get, remove, update, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const db = getDatabase(initializeApp({
        databaseURL: "https://tdejur-e5d96-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "tdejur-e5d96"
    }));

    window.saveData = () => {
        const id = document.getElementById('editId').value;
        const data = { p1: document.getElementById('p1').value, p2: document.getElementById('p2').value, p3: document.getElementById('p3').value, p4: document.getElementById('p4').value, p5: document.getElementById('p5').value, p6: document.getElementById('p6').value, p7: document.getElementById('p7').value, p8: document.getElementById('p8').value, p9: document.getElementById('p9').value, p10: document.getElementById('p10').value };
        
        if (id) {
            update(ref(db, 'prisoners/' + id), data).then(() => location.reload());
        } else {
            push(ref(db, 'prisoners/'), data).then(() => location.reload());
        }
    };

    window.editPrisoner = (id, p) => {
        document.getElementById('editId').value = id;
        for(let i=1; i<=10; i++) document.getElementById('p'+i).value = p['p'+i] || '';
        document.getElementById('saveBtn').innerText = "Янгилаш";
        document.getElementById('formTitle').innerText = "Таҳрирлаш";
    };

    window.deletePrisoner = (id) => { if(confirm("Ўчирмоқчимисиз?")) remove(ref(db, 'prisoners/' + id)).then(() => location.reload()); };

    window.onload = async () => {
        const snapshot = await get(ref(db, 'prisoners/'));
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const p = child.val();
                document.getElementById('prisonerTable').innerHTML += `<tr><td>${p.p1}</td><td>${p.p2}/${p.p3}</td><td>${p.p4}/${p.p5}</td><td>${p.p6}/${p.p7}</td><td>${p.p8}-${p.p9}</td><td>${p.p10}</td></tr>`;
                document.getElementById('adminTable').innerHTML += `<tr><td>${p.p1}</td><td>
                    <button class="edit-btn" onclick='editPrisoner("${child.key}", ${JSON.stringify(p)})'>✍️</button>
                    <button class="del-btn" onclick="deletePrisoner('${child.key}')">❌</button>
                </td></tr>`;
            });
        }
    };

    window.checkPassword = () => {
        if (document.getElementById("menuPass").value === "7777") document.getElementById("adminPanel").style.display = 'block';
        else alert('Парол хато!');
    };
    document.getElementById("menuPass").addEventListener("keypress", (e) => { if(e.key === "Enter") checkPassword(); });
</script>
</body>
</html>
